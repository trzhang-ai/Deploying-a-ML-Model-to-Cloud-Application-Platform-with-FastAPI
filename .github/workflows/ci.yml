name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install project dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest
      - name: Check code style
        run: uv run --locked flake8 starter/main.py starter/starter/ml/data.py starter/starter/ml/model.py starter/starter/train_model.py tests --max-line-length=79